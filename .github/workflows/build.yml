name: Sabi build validation
on:
  push:
    branches:
      - migration/baseline-import
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package.json
      - name: Install dependencies and generate lockfile
        working-directory: src
        run: npm install
      - name: Build Next.js app
        working-directory: src
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Commit lockfile for Firebase App Hosting
        run: |
          git add src/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add npm lockfile [skip ci]"
            git push
          fi
